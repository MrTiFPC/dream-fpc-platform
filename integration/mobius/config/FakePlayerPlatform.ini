# ---------------------------------------------------------------------------
# Fakeplayer / FPC platform bootstrap - public Warg community template
# ---------------------------------------------------------------------------

# Enable the newer fakeplayer/FPC platform.
EnableFpcPlatform = True

# Choose which fakeplayer boot paths GameServer should initialize.
# Values:
# - legacy   = only legacy Mobius fakeplayer chat/bootstrap
# - platform = only the newer branch-local FPC platform
# - both     = preserve the dual-boot behavior
FpcBootstrapMode = both

# Stable host/runtime adapter identifier used by the branch-local FPC platform.
FpcPlatformAdapterId = mobius_tier_a

# Stable fakeplayer ruleset identifier used by the branch-local platform.
FpcRulesetId = essence_warg

# Product posture:
# - community = public Warg community source/runtime
# - dev       = local development with Studio and optional provider seams
FpcProductEdition = community

# Public authoring/provider posture.
EnableFpcStudio = True
EnableFpcExternalPersonality = True
